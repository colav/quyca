# The app reads its config from .env.dev / .env.prod (see .env.example), mounted with the code in /app.
x-quyca: &quyca
  network_mode: host
  restart: unless-stopped
  volumes:
    - .:/app

services:
  dev:
    <<: *quyca
    container_name: quyca-dev
    image: colav/quyca-dev:dev
    build:
      context: .
      network: host
      target: development

  prod:
    <<: *quyca
    container_name: quyca-prod
    image: colav/quyca-prod:latest
    build:
      context: .
      network: host
      target: production
